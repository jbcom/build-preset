name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph
        run: pnpm audit --audit-level=high --prod
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - name: Verify source-owned build preset and packed consumer
        run: pnpm --filter @arcade-cabinet/build-preset verify
      - name: Lint the repository harness
        run: pnpm lint

  browser:
    name: Fresh anonymous headed consumer
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install headed Chromium
        run: pnpm --filter @arcade-cabinet/build-preset exec playwright install --with-deps --no-shell chromium
      - name: Fresh anonymous build-preset headed consumer
        env:
          BUILD_PRESET_RUN_BROWSER: "1"
        run: xvfb-run -a pnpm --filter @arcade-cabinet/build-preset run smoke:tarball
